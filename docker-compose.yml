services:
  wireguard-adguard:
    build:
      context: .
      dockerfile: Dockerfile
    image: wireguard-adguard:latest
    container_name: wireguard-adguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    ports:
      # WireGuard VPN UDP Port
      - "${SERVERPORT:-51820}:51820/udp"
      # AdGuard Home Web Dashboard (Host:Container)
      - "${WEB_PORT_HOST:-3000}:${WEB_PORT:-3000}/tcp"
      # (Opsional) Buka port DNS jika ingin AdGuard Home bisa diakses langsung oleh LAN tanpa VPN:
      # - "53:53/tcp"
      # - "53:53/udp"
    volumes:
      # Semua data konfigurasi (WireGuard keys, client profiles, QR codes, AdGuard stats) tersimpan di sini
      - ./data:/data
    environment:
      # IP Publik atau Domain VPS Anda. Jika "auto", akan dideteksi otomatis saat startup.
      - SERVERURL=${SERVERURL:-auto}
      # Port WireGuard
      - SERVERPORT=51820
      # Jumlah peer (misal: 3) ATAU nama-nama peer dipisah koma (misal: phone,laptop,pc)
      - PEERS=${PEERS:-1}
      # Subnet internal VPN
      - INTERNAL_SUBNET=10.13.13.0/24
      # Routing IP untuk client (0.0.0.0/0 = full tunnel VPN)
      - ALLOWEDIPS=0.0.0.0/0, ::/0
      # Port Web Dashboard AdGuard Home
      - WEB_PORT=3000
      # Kredensial awal Dashboard AdGuard Home
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      # Paksa semua traffic DNS di VPN melewati AdGuard Home (mencegah bypass DNS)
      - FORCE_DNS_REDIRECT=true
      # Timezone
      - TZ=Asia/Jakarta
